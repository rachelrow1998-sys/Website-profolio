# 把网站发布到 GitHub Pages。
# 纯静态站，没有 build 步骤 —— 直接把仓库根目录整个传上去。
#
# enablement: true 会在第一次跑的时候自动帮仓库打开 Pages，
# 所以不用先去 Settings 里点。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/online-portfolio-website-2x0nbr
      - claude/free-domain-portfolio-b8rz0k
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新的推送不打断正在进行的那一次。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # data.js 是唯一的内容来源。这里重跑一次同步，
      # 万一改了 data.js 忘了跑 npm run sync，线上也不会是旧的。
      - run: node tools/sync-static.mjs

      - uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 的话，这一步直接帮忙开好。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
