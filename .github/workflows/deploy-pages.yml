# 把网站发布到 GitHub Pages。
# 纯静态站，没有 build 步骤 —— 直接把仓库根目录整个传上去。
#
# ⚠️ 第一次要先去仓库 Settings → Pages → Source 选 "GitHub Actions"，
#    只需要点这一次。（试过让流程自己开：创建 Pages 站点要仓库管理员权限，
#    workflow 的 GITHUB_TOKEN 拿不到，会报 Resource not accessible by integration）
name: Deploy to GitHub Pages

# 全站只用 main 一个分支：推 main → 自动部署。
# （以前这里挂着两个 claude/* 分支，已经统一掉了。）
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新的推送不打断正在进行的那一次。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # data.js 是唯一的内容来源。这里重跑一次同步，
      # 万一改了 data.js 忘了跑 npm run sync，线上也不会是旧的。
      - run: node tools/sync-static.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
