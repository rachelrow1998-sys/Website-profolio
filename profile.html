<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rachel Row — F1 Profile</title>
<meta name="description" content="Driver profile. Move the light to see the other layer.">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">

<meta property="og:type" content="profile">
<meta property="og:title" content="Rachel Row — F1 Profile">
<meta property="og:description" content="Driver profile. Move the light to see the other layer.">
<meta property="og:image" content="assets/img/profile/portrait.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FFFFFF'/><circle cx='50' cy='50' r='26' fill='%230B0B0C'/></svg>">

<link rel="preload" href="assets/fonts/playfair-display-400-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/img/profile/portrait.jpg" as="image">

<script>
/* 首屏前先把「这台设备到底能不能玩这个交互」定下来。
   等 profile.js 跑起来才加类的话，光标会先出现再消失，闪一下很难看。 */
(function () {
  var d = document.documentElement;
  d.className = d.className.replace("no-js", "js");
  try {
    if (matchMedia("(hover:hover) and (pointer:fine)").matches) d.className += " js-hover";
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>

<!-- ==========================================================================
     照片。两层用同一套裁切参数（--focus-x / --focus-y），必须像素级对齐。
     换照片只要把文件丢进 assets/img/profile/，文件名别改；
     还没放真照片之前，onerror 会自动退回同名的占位图，页面不会开天窗。
     ========================================================================== -->
<div class="stage">
  <img class="stage__base"
       src="assets/img/profile/portrait.jpg"
       onerror="this.onerror=null;this.src='assets/img/profile/portrait.placeholder.svg'"
       alt="Rachel Row in racing suit, arms folded">
  <img class="stage__src"
       src="assets/img/profile/helmet.jpg"
       onerror="this.onerror=null;this.src='assets/img/profile/helmet.placeholder.svg'"
       alt="" aria-hidden="true">
  <canvas class="stage__reveal" aria-hidden="true"></canvas>
</div>

<!-- 网格：一层墨色压在照片白底上，一层白色只在圆形高光里显影 -->
<div class="grid grid--ink" aria-hidden="true"></div>
<div class="grid grid--lit" aria-hidden="true"></div>

<!-- ==========================================================================
     四个角。data-lit = 圆形高光扫到它就反白（300ms）。
     ========================================================================== -->
<div class="ui">

  <!-- 左上：名字，姓和名各一行。⚠️ 改成你自己的 -->
  <header class="corner corner--tl">
    <h1 class="name">
      <span class="name__first" data-lit>Rachel</span>
      <span class="name__last"  data-lit>Row</span>
    </h1>
  </header>

  <!-- 右上：导航 -->
  <nav class="corner corner--tr" aria-label="Primary">
    <a class="nav-link" href="#records" data-lit aria-expanded="false" aria-controls="records">F1 Records</a>
  </nav>

  <!-- 右下：社交。⚠️ 两个 href 改成你自己的账号主页 -->
  <ul class="social corner corner--br">
    <li>
      <a href="https://www.instagram.com/yourhandle/" rel="me noopener" target="_blank" data-lit aria-label="Instagram">
        <!-- Instagram（Simple Icons，CC0），实心单色 -->

1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg>
      </a>
    </li>
    <li>
      <a href="https://twitter.com/yourhandle" rel="me noopener" target="_blank" data-lit aria-label="Twitter">
        <!-- Twitter（Simple Icons，CC0）。想换成现在的 X 标志，把 d 换成：
             M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21.543 7.104c.015.211.015.423.015.636 0 6.507-4.954 14.01-14.01 14.01v-.003A13.94 13.94 0 0 1 0 19.539a9.88 9.88 0 0 0 7.287-2.041 4.93 4.93 0 0 1-4.6-3.42 4.916 4.916 0 0 0 2.223-.084A4.926 4.926 0 0 1 .96 9.167v-.062a4.887 4.887 0 0 0 2.235.616A4.928 4.928 0 0 1 1.67 3.148 13.98 13.98 0 0 0 11.82 8.292a4.929 4.929 0 0 1 8.39-4.49 9.868 9.868 0 0 0 3.128-1.196 4.941 4.941 0 0 1-2.165 2.724A9.828 9.828 0 0 0 24 4.555a10.019 10.019 0 0 1-2.457 2.549z"/></svg>
      </a>
    </li>
  </ul>

  <!-- 左下：一句提示，鼠标一动就自己淡掉 -->
  <p class="hint corner corner--bl" data-lit><span class="dot"></span>Move to reveal</p>

</div>

<!-- ==========================================================================
     F1 Records —— 右上角那个链接得有地方去。
     ⚠️ 下面的数字全是空的（—），请自己填。我不会替你编成绩。
     ========================================================================== -->
<section class="records" id="records" aria-hidden="true" aria-labelledby="records-title">
  <button class="records__close" type="button">Close</button>
  <div class="records__inner">
    <h2 id="records-title">F1 Records</h2>
    <dl>
      <dt>Debut</dt>          <dd>—</dd>
      <dt>Team</dt>           <dd>—</dd>
      <dt>Race starts</dt>    <dd>—</dd>
      <dt>Podiums</dt>        <dd>—</dd>
      <dt>Pole positions</dt> <dd>—</dd>
      <dt>Best finish</dt>    <dd>—</dd>
    </dl>
  </div>
</section>

<script src="assets/js/profile.js"></script>
</body>
</html>
